name: Health check

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Warm the schedule
        run: |
          curl -fsS https://contestradar.vercel.app/api/contests > /dev/null

      - name: Check production health
        run: |
          for attempt in 1 2 3; do
            if curl -fsS https://contestradar.vercel.app/api/health; then
              exit 0
            fi
            sleep 10
          done
          exit 1
